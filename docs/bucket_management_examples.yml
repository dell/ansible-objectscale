---
- name: ObjectScale Bucket Management Examples
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    objectscale_host: "192.168.1.1"
    objectscale_username: "admin"
    objectscale_password: "password"
    namespace: "dev-namespace"
    bucket_name: "ansible-test-bucket-{{ 1000 | random }}"

  tasks:
    - name: "1. Create a new bucket with versioning"
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        name: "{{ bucket_name }}"
        namespace: "{{ namespace }}"
        state: present
        versioning: true
      register: create_result

    - name: "Assert creation changed status"
      assert:
        that:
          - create_result.changed

    - name: "2. Get information about the created bucket"
      dellemc.objectscale.bucket_info:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        name: "{{ bucket_name }}"
        namespace: "{{ namespace }}"
      register: info_result

    - name: "Assert info result"
      assert:
        that:
          - not info_result.changed
          - info_result.buckets | length == 1
          - info_result.buckets[0].name == bucket_name

    - name: "3. Attempt to create the same bucket again (Idempotency)"
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        name: "{{ bucket_name }}"
        namespace: "{{ namespace }}"
        state: present
      register: idempotency_result

    - name: "Assert no change on second creation"
      assert:
        that:
          - not idempotency_result.changed

    - name: "4. Delete the bucket"
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        name: "{{ bucket_name }}"
        namespace: "{{ namespace }}"
        state: absent
      register: delete_result

    - name: "Assert deletion changed status"
      assert:
        that:
          - delete_result.changed
