name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    name: Build collection
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-version: [stable-2.18, stable-2.19, stable-2.20]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install ansible (${{ matrix.ansible-version }})
        run: |
          case "${{ matrix.ansible-version }}" in
            stable-2.20) pip install ansible-core==2.20.0 --disable-pip-version-check ;;
            stable-2.19) pip install ansible-core==2.19.0 --disable-pip-version-check ;;
            stable-2.18) pip install ansible-core==2.18.0 --disable-pip-version-check ;;
            stable-2.17) pip install ansible-core==2.17.0 --disable-pip-version-check ;;
            devel) pip install git+https://github.com/ansible/ansible.git@devel --disable-pip-version-check ;;
            *) pip install ansible-core --disable-pip-version-check ;;
          esac

      - name: Build a collection tarball
        run: ansible-galaxy collection build --output-path "${GITHUB_WORKSPACE}/.cache/collection-tarballs"

      - name: Store migrated collection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collection
          path: .cache/collection-tarballs

  ###
  # Unit tests (OPTIONAL)
  #
  # https://docs.ansible.com/ansible/latest/dev_guide/testing_units.html

  unit:
    name: Unit Tests (Ⓐ${{ matrix.ansible }} with ${{ matrix.python }} python)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        ansible:
          - stable-2.18
          - stable-2.19
          - stable-2.20
        exclude:
          - python: '3.11'
            ansible: stable-2.20

    steps:
      - name: Clean up disk space
        run: |
          sudo rm -rf /tmp/*
          sudo apt-get clean
          df -h

      - name: Cache ansible-core
        uses: actions/cache@v4
        with:
          path: ~/.local/lib/python*/site-packages/ansible_core
          key: ansible-${{ matrix.ansible }}-py${{ matrix.python }}
          restore-keys: |
            ansible-${{ matrix.ansible }}-
        timeout-minutes: 5

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python }}-
          enableCrossOsArchive: true
        timeout-minutes: 5

      - name: Perform unit testing with ansible-test
        uses: ansible-community/ansible-test-gh-action@release/v1.16
        with:
          testing-type: units
          coverage: always
          ansible-core-version: ${{ matrix.ansible }}
          origin-python-version: ${{ matrix.python }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  ###
  # Sanity tests (REQUIRED)
  #
  # https://docs.ansible.com/ansible/latest/dev_guide/testing_sanity.html

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }} with ${{ matrix.python }} python)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        ansible:
          - stable-2.18
          - stable-2.19
          - stable-2.20
        exclude:
          - python: '3.11'
            ansible: stable-2.20

    steps:
      - name: Clean up disk space
        run: |
          sudo rm -rf /tmp/*
          sudo apt-get clean
          df -h

      - name: Cache ansible-core
        uses: actions/cache@v4
        with:
          path: ~/.local/lib/python*/site-packages/ansible_core
          key: ansible-${{ matrix.ansible }}-py${{ matrix.python }}
          restore-keys: |
            ansible-${{ matrix.ansible }}-
        timeout-minutes: 5

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python }}-
          enableCrossOsArchive: true
        timeout-minutes: 5

      - name: Perform sanity testing
        uses: ansible-community/ansible-test-gh-action@release/v1.16
        with:
          ansible-core-version: ${{ matrix.ansible }}
          origin-python-version: ${{ matrix.python }}
          testing-type: sanity
          pull-request-change-detection: true
          coverage: never

  ansible-lint:
    needs: [build]
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
