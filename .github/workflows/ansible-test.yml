name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  build:
    name: Build collection
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-version: [stable-2.19]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install ansible (${{ matrix.ansible-version }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible-version }}.tar.gz --disable-pip-version-check

      - name: Build a collection tarball
        run: ansible-galaxy collection build --output-path "${GITHUB_WORKSPACE}/.cache/collection-tarballs"

      - name: Store migrated collection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collection
          path: .cache/collection-tarballs

  ###
  # Unit tests (OPTIONAL)
  #
  # https://docs.ansible.com/ansible/latest/dev_guide/testing_units.html

  unit:
    name: Unit Tests (Ⓐ${{ matrix.ansible }} with ${{ matrix.python }} python)
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
        ansible:
          - stable-2.19

    steps:
      - name: Cache ansible-core
        uses: actions/cache@v4
        with:
          path: ~/.local/lib/python*/site-packages/ansible*
          key: ansible-${{ matrix.ansible }}-py${{ matrix.python }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python }}-

      - name: Perform unit testing with ansible-test
        uses: ansible-community/ansible-test-gh-action@release/v1.16
        with:
          testing-type: units
          coverage: always
          ansible-core-version: ${{ matrix.ansible }}
          origin-python-version: ${{ matrix.python }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  ###
  # Sanity tests (REQUIRED)
  #
  # https://docs.ansible.com/ansible/latest/dev_guide/testing_sanity.html

  sanity:
    name: Sanity (Ⓐ${{ matrix.ansible }} with ${{ matrix.python }} python)
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
        ansible:
          - stable-2.19

    steps:
      - name: Cache ansible-core
        uses: actions/cache@v4
        with:
          path: ~/.local/lib/python*/site-packages/ansible*
          key: ansible-${{ matrix.ansible }}-py${{ matrix.python }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ matrix.python }}-

      - name: Perform sanity testing
        uses: ansible-community/ansible-test-gh-action@release/v1.16
        with:
          ansible-core-version: ${{ matrix.ansible }}
          origin-python-version: ${{ matrix.python }}
          testing-type: sanity
          pull-request-change-detection: true
          coverage: never

  ansible-lint:
    needs: [build]
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
