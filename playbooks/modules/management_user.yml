---
- name: Management User Management Examples
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    objectscale_host: "{{ lookup('env', 'OBJECTSCALE_HOST') }}"
    objectscale_username: "{{ lookup('env', 'OBJECTSCALE_USERNAME') }}"
    objectscale_password: "{{ lookup('env', 'OBJECTSCALE_PASSWORD') }}"
    validate_certs: false
    local_user_user_id: "localuser1"
    ad_ldap_user_user_id: "user1@domain"
    ad_ldap_group_user_id: "group1@domain"
    local_user_password: "{{ lookup('env', 'LOCAL_USER_PASSWORD') }}"
    local_user_password_new: "{{ lookup('env', 'LOCAL_USER_PASSWORD_NEW') }}"

  tasks:
    # ==================== Local User Tasks ====================
    - name: Create a Local User with System Monitor role
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ local_user_user_id }}"
        password: "{{ local_user_password }}"
        is_system_monitor: true
        state: present
      no_log: true
      register: create_local_user

    - name: Verify the user was created
      ansible.builtin.assert:
        that:
          - create_local_user.changed
          - create_local_user.management_user_details.user_id
            == local_user_user_id
        fail_msg: "Local User was not created"

    - name: Idempotence check - re-run with the same desired state
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ local_user_user_id }}"
        is_system_monitor: true
        state: present
      register: idem

    - name: Assert idempotence
      ansible.builtin.assert:
        that:
          - not idem.changed
        fail_msg: "Local User create was not idempotent"

    - name: Update Local User to have System Admin and
        Security Admin roles and a new password
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ local_user_user_id }}"
        password: "{{ local_user_password_new }}"
        is_system_admin: true
        is_security_admin: true
        state: present
      no_log: true

    - name: Delete the Local User
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ local_user_user_id }}"
        state: absent

    # ==================== AD LDAP User Tasks ====================
    - name: Create an AD/LDAP User with System Monitor role
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ ad_ldap_user_user_id }}"
        is_system_monitor: true
        state: present
      register: create_ad_ldap_user

    - name: Verify the AD/LDAP user was created
      ansible.builtin.assert:
        that:
          - create_ad_ldap_user.changed
          - create_ad_ldap_user.management_user_details.user_id
            == ad_ldap_user_user_id
        fail_msg: "AD/LDAP User was not created"

    - name: Update AD/LDAP User to have System Admin and Security Admin roles
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ ad_ldap_user_user_id }}"
        is_system_admin: true
        is_security_admin: true
        state: present

    - name: Delete the AD/LDAP User
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ ad_ldap_user_user_id }}"
        state: absent

    # ==================== AD LDAP Group Tasks ====================
    - name: Create an AD/LDAP Group with System Monitor role
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ ad_ldap_group_user_id }}"
        is_system_monitor: true
        is_external_group: true
        state: present
      register: create_ad_ldap_group

    - name: Verify the AD/LDAP group was created
      ansible.builtin.assert:
        that:
          - create_ad_ldap_group.changed
          - create_ad_ldap_group.management_user_details.user_id
            == ad_ldap_group_user_id
        fail_msg: "AD/LDAP Group was not created"

    - name: Update AD/LDAP Group to have System Admin and Security Admin roles
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ ad_ldap_group_user_id }}"
        is_system_admin: true
        is_security_admin: true
        state: present

    - name: Delete the AD/LDAP Group
      dellemc.objectscale.management_user:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        user_id: "{{ ad_ldap_group_user_id }}"
        state: absent
