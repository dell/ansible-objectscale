---
- name: Storage Pool Management Examples
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    objectscale_host: >-
      {{ lookup('env', 'OBJECTSCALE_HOST')
      | default('objectscale.example.com', true) }}
    objectscale_username: >-
      {{ lookup('env', 'OBJECTSCALE_USERNAME')
      | default('admin', true) }}
    objectscale_password: >-
      {{ lookup('env', 'OBJECTSCALE_PASSWORD')
      | default('password', true) }}

  tasks:
    - name: Create a storage pool
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "sp_ansible_demo"
        description: "Ansible-managed storage pool"
        is_cold_storage_enabled: false
        warning_alert_at: 70
        error_alert_at: 85
        state: present
      register: create_result

    - name: Display created pool details
      ansible.builtin.debug:
        var: create_result.storage_pool_details

    - name: Modify storage pool description
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "sp_ansible_demo"
        description: "Updated by Ansible automation"
        state: present
      register: modify_result

    - name: Display modify result
      ansible.builtin.debug:
        var: modify_result

    - name: Idempotent create (no change expected)
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "sp_ansible_demo"
        description: "Updated by Ansible automation"
        state: present
      register: idempotent_result

    - name: Display idempotent result (changed should be false)
      ansible.builtin.debug:
        var: idempotent_result.changed

    - name: Check mode - preview storage pool creation
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "sp_ansible_check"
        description: "Check mode example"
        state: present
      check_mode: true
      register: check_result

    - name: Display check mode result
      ansible.builtin.debug:
        var: check_result

    - name: Delete storage pool (cleanup)
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "sp_ansible_demo"
        state: absent
      register: delete_result
      when: cleanup | default(false) | bool

    - name: Display delete result
      ansible.builtin.debug:
        var: delete_result
      when: cleanup | default(false) | bool
