---
# Example: Query Object-cert keystore certificate chain on Dell ObjectScale.
# Demonstrates: basic read, compliance audit, conditional logic.
- name: VDC Certificate Chain Info Examples
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    objectscale_host: >-
      {{ lookup('env', 'OBJECTSCALE_HOST')
      | default('objectscale.example.com', true) }}
    objectscale_username: >-
      {{ lookup('env', 'OBJECTSCALE_USERNAME')
      | default('admin', true) }}
    objectscale_password: >-
      {{ lookup('env', 'OBJECTSCALE_PASSWORD')
      | default('password', true) }}

  tasks:
    - name: Get current Object-cert certificate chain
      dellemc.objectscale.vdc_certificate_chain_info:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
      register: chain_info

    - name: Display certificate details
      ansible.builtin.debug:
        msg: |
          Fingerprint: {{ chain_info.vdc_certificate_chain_details
          .fingerprint }}
          Chain Length: {{ chain_info.vdc_certificate_chain_details
          .chain_length }}
          Leaf Subject: {{ chain_info.vdc_certificate_chain_details
          .leaf_subject | default('N/A - install cryptography') }}
          Not After: {{ chain_info.vdc_certificate_chain_details
          .not_after | default('N/A') }}

    - name: Compliance audit — check if certificate metadata is available
      ansible.builtin.debug:
        msg: >-
          WARNING: Install the 'cryptography' Python package
          for full certificate metadata
      when: chain_info.vdc_certificate_chain_details.leaf_subject
            is not defined
