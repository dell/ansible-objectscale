---
- name: Create a new bucket (Idempotency Check)
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}"
    namespace: "{{ namespace }}"
    state: present
  register: result

- name: Assert bucket creation
  assert:
    that:
      - result.changed

- name: Run create again to check for idempotency
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}"
    namespace: "{{ namespace }}"
    state: present
  register: result

- name: Assert idempotency on creation
  assert:
    that:
      - not result.changed

- name: Update bucket versioning
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}"
    namespace: "{{ namespace }}"
    state: present
    versioning: true
  register: result

- name: Assert versioning update
  assert:
    that:
      - result.changed

- name: Delete the bucket (Idempotency Check)
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}"
    namespace: "{{ namespace }}"
    state: absent
  register: result

- name: Assert bucket deletion
  assert:
    that:
      - result.changed

- name: Run delete again to check for idempotency
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}"
    namespace: "{{ namespace }}"
    state: absent
  register: result

- name: Assert idempotency on deletion
  assert:
    that:
      - not result.changed
