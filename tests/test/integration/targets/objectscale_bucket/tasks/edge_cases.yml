---
- name: EC-01 | Attempt to create a bucket with an invalid name
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "Invalid-Bucket-Name-UPPERCASE"
    namespace: "{{ namespace }}"
    state: present
  register: result
  ignore_errors: true

- name: Assert that the invalid name task failed
  assert:
    that:
      - result.failed
      - "'InvalidBucketName' in result.msg"

- name: EC-05 | Attempt to create a bucket with a name that is too long
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "this-bucket-name-is-far-too-long-and-should-certainly-exceed-the-sixty-three-character-limit"
    namespace: "{{ namespace }}"
    state: present
  register: result
  ignore_errors: true

- name: Assert that the long name task failed
  assert:
    that:
      - result.failed
      - "'InvalidBucketName' in result.msg"

- name: EC-02 | Setup: Create a bucket and add an object to it
  block:
    - name: Create bucket for non-empty test
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        name: "{{ bucket_name }}_not_empty"
        namespace: "{{ namespace }}"
        state: present

    # This task would normally use an s3_object module or similar to upload a file.
    # For this test, we assume the bucket is made non-empty by some other means.

- name: EC-02 | Attempt to delete a non-empty bucket
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}_not_empty"
    namespace: "{{ namespace }}"
    state: absent
  register: result
  ignore_errors: true

- name: Assert that deleting a non-empty bucket failed
  assert:
    that:
      - result.failed
      - "'BucketNotEmpty' in result.msg"

- name: EC-02 | Teardown: Clean up the bucket
  dellemc.objectscale.bucket:
    objectscale_host: "{{ objectscale_host }}"
    objectscale_username: "{{ objectscale_username }}"
    objectscale_password: "{{ objectscale_password }}"
    validate_certs: false
    name: "{{ bucket_name }}_not_empty"
    namespace: "{{ namespace }}"
    state: absent
    force: true # Assuming a 'force' parameter will be implemented to handle this
