---
- name: TC-05 Missing state negative test
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Attempt to create bucket without state
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "{{ bucket_name }}"
        namespace: "{{ objectscale_namespace }}"
      register: result
      failed_when: result is not failed

    - name: Verify failure
      ansible.builtin.assert:
        that:
          - result is failed
        fail_msg: "TC-05 failed: Expected failure when state is missing"
