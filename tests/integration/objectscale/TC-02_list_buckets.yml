---
- name: TC-02 List all buckets in namespace
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: List all buckets in namespace
      dellemc.objectscale.bucket_info:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        namespace: "{{ objectscale_namespace }}"
      register: result

    - name: Verify bucket list retrieved
      ansible.builtin.assert:
        that:
          - result.buckets is defined
          - result.buckets | length > 0
        fail_msg: "TC-02 failed: {{ result }}"
