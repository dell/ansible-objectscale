---
- name: TC-04 Get nonexistent bucket info negative test
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Attempt to get info for nonexistent bucket
      dellemc.objectscale.bucket_info:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "nonexistent-bucket-xyz"
        namespace: "{{ objectscale_namespace }}"
      register: result
      failed_when: result is not failed

    - name: Verify failure
      ansible.builtin.assert:
        that:
          - result is failed
        fail_msg: "TC-04 failed: Expected failure when bucket does not exist"
