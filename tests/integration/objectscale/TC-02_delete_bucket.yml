---
- name: TC-02 Delete a bucket
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create bucket for deletion test
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        bucket_name: "{{ bucket_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present

    - name: Delete bucket
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        bucket_name: "{{ bucket_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: absent
      register: result

    - name: Verify delete results
      ansible.builtin.assert:
        that:
          - result.changed
        fail_msg: "TC-02 failed: {{ result }}"

    - name: Idempotence check - delete nonexistent bucket
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        bucket_name: "{{ bucket_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: absent
      register: idem

    - name: Assert idempotence
      ansible.builtin.assert:
        that:
          - not idem.changed
        fail_msg: "TC-02 idempotence failed: {{ idem }}"
