---
- name: TC-06 Invalid state value negative test
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Attempt to create bucket with invalid state
      dellemc.objectscale.bucket:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
        bucket_name: "{{ bucket_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: "invalid_state"
      register: result
      failed_when: result is not failed

    - name: Verify failure
      ansible.builtin.assert:
        that:
          - result is failed
        fail_msg: "TC-06 failed: Expected failure when state is invalid"
