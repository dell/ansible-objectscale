---
- name: TC-03 Missing namespace negative test
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Attempt to list buckets without namespace
      dellemc.objectscale.bucket_info:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_port: "{{ objectscale_port }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: "{{ validate_certs }}"
      register: result
      failed_when: result is not failed

    - name: Verify failure
      ansible.builtin.assert:
        that:
          - result is failed
        fail_msg: "TC-03 failed: Expected failure when namespace is missing"
