---
# ============================================================================
# update_by_id.yaml — Storage Pool update by ID tests
# TC-01: Lookup by ID and update description (4-phase)
# ============================================================================

- module_defaults:
    dellemc.objectscale.storage_pool:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.storage_pool_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # Discover test pool
    - name: "Setup — Discover pool"
      ansible.builtin.include_tasks: _helper_get_pool.yaml

    # ==================================================================
    # TC-01: Update by ID (4-phase)
    # ==================================================================
    - name: "TC-01 Phase 1 — Update by ID (check mode)"
      dellemc.objectscale.storage_pool:
        storage_pool_id: "{{ test_pool_id }}"
        description: "FT-updated-by-id"
        state: present
      check_mode: true
      register: tc01_check

    - name: "TC-01 Phase 1 — Assert check mode changed"
      ansible.builtin.assert:
        that:
          - tc01_check.changed == true
        fail_msg: "TC-01 Phase 1 FAILED"
        success_msg: "TC-01 Phase 1 PASSED"

    - name: "TC-01 Phase 2 — Update by ID (apply)"
      dellemc.objectscale.storage_pool:
        storage_pool_id: "{{ test_pool_id }}"
        description: "FT-updated-by-id"
        state: present
      register: tc01_apply

    - name: "TC-01 Phase 2 — Assert changed"
      ansible.builtin.assert:
        that:
          - tc01_apply.changed == true
          - tc01_apply.storage_pool_details is defined
        fail_msg: "TC-01 Phase 2 FAILED"
        success_msg: "TC-01 Phase 2 PASSED"

    - name: "TC-01 Phase 2 — Verify via info"
      dellemc.objectscale.storage_pool_info:
        name: "{{ test_pool_name }}"
      register: tc01_info

    - name: "TC-01 Phase 2 — Assert description"
      ansible.builtin.assert:
        that:
          - tc01_info.storage_pools[0].description == "FT-updated-by-id"
        fail_msg: "TC-01 Phase 2 FAILED: description not updated"
        success_msg: "TC-01 Phase 2 verified"

    - name: "TC-01 Phase 3 — Re-run (check mode, no change)"
      dellemc.objectscale.storage_pool:
        storage_pool_id: "{{ test_pool_id }}"
        description: "FT-updated-by-id"
        state: present
      check_mode: true
      register: tc01_check_idem

    - name: "TC-01 Phase 3 — Assert no change"
      ansible.builtin.assert:
        that:
          - tc01_check_idem.changed == false
        fail_msg: "TC-01 Phase 3 FAILED"
        success_msg: "TC-01 Phase 3 PASSED"

    - name: "TC-01 Phase 4 — Re-run (idempotence)"
      dellemc.objectscale.storage_pool:
        storage_pool_id: "{{ test_pool_id }}"
        description: "FT-updated-by-id"
        state: present
      register: tc01_idem

    - name: "TC-01 Phase 4 — Assert idempotent"
      ansible.builtin.assert:
        that:
          - tc01_idem.changed == false
        fail_msg: "TC-01 Phase 4 FAILED"
        success_msg: "TC-01 Phase 4 PASSED"

  always:
    - name: "Cleanup — Restore original values"
      ansible.builtin.include_tasks: _helper_restore.yaml
