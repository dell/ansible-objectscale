---
# ============================================================================
# update_combined.yaml — Storage Pool combined update tests
# TC-01: Update description + alerts in a single call (4-phase)
# ============================================================================

- module_defaults:
    dellemc.objectscale.storage_pool:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.storage_pool_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # Discover test pool
    - name: "Setup — Discover pool"
      ansible.builtin.include_tasks: _helper_get_pool.yaml

    # ==================================================================
    # TC-01: Combined update (4-phase)
    # ==================================================================
    - name: "TC-01 Phase 1 — Combined update (check mode)"
      dellemc.objectscale.storage_pool:
        storage_pool_name: "{{ test_pool_name }}"
        description: "FT-combined-update"
        warning_alert_at: 60
        error_alert_at: 80
        critical_alert_at: 90
        state: present
      check_mode: true
      register: tc01_check

    - name: "TC-01 Phase 1 — Assert changed"
      ansible.builtin.assert:
        that:
          - tc01_check.changed == true
        fail_msg: "TC-01 Phase 1 FAILED"
        success_msg: "TC-01 Phase 1 PASSED"

    - name: "TC-01 Phase 2 — Combined update (apply)"
      dellemc.objectscale.storage_pool:
        storage_pool_name: "{{ test_pool_name }}"
        description: "FT-combined-update"
        warning_alert_at: 60
        error_alert_at: 80
        critical_alert_at: 90
        state: present
      register: tc01_apply

    - name: "TC-01 Phase 2 — Assert changed"
      ansible.builtin.assert:
        that:
          - tc01_apply.changed == true
          - tc01_apply.storage_pool_details is defined
        fail_msg: "TC-01 Phase 2 FAILED"
        success_msg: "TC-01 Phase 2 PASSED"

    - name: "TC-01 Phase 2 — Verify all fields"
      dellemc.objectscale.storage_pool_info:
        name: "{{ test_pool_name }}"
      register: tc01_info

    - name: "TC-01 Phase 2 — Assert all fields updated"
      ansible.builtin.assert:
        that:
          - tc01_info.storage_pools[0].description == "FT-combined-update"
          - tc01_info.storage_pools[0].warningAlertAt == 60
          - tc01_info.storage_pools[0].errorAlertAt == 80
          - tc01_info.storage_pools[0].criticalAlertAt == 90
        fail_msg: "TC-01 Phase 2 FAILED: not all fields updated"
        success_msg: "TC-01 Phase 2 all fields verified"

    - name: "TC-01 Phase 3 — Re-run (check mode, no change)"
      dellemc.objectscale.storage_pool:
        storage_pool_name: "{{ test_pool_name }}"
        description: "FT-combined-update"
        warning_alert_at: 60
        error_alert_at: 80
        critical_alert_at: 90
        state: present
      check_mode: true
      register: tc01_check_idem

    - name: "TC-01 Phase 3 — Assert no change"
      ansible.builtin.assert:
        that:
          - tc01_check_idem.changed == false
        fail_msg: "TC-01 Phase 3 FAILED"
        success_msg: "TC-01 Phase 3 PASSED"

    - name: "TC-01 Phase 4 — Re-run (idempotence)"
      dellemc.objectscale.storage_pool:
        storage_pool_name: "{{ test_pool_name }}"
        description: "FT-combined-update"
        warning_alert_at: 60
        error_alert_at: 80
        critical_alert_at: 90
        state: present
      register: tc01_idem

    - name: "TC-01 Phase 4 — Assert idempotent"
      ansible.builtin.assert:
        that:
          - tc01_idem.changed == false
        fail_msg: "TC-01 Phase 4 FAILED"
        success_msg: "TC-01 Phase 4 PASSED"

  always:
    - name: "Cleanup — Restore original values"
      ansible.builtin.include_tasks: _helper_restore.yaml
