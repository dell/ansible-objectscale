---
# Test variables for iam_role functional tests
iam_role_name: "osam_test_role"
iam_role_name_2: "osam_test_role_2"

# Managed policy ARN that must exist on the ObjectScale system
managed_policy_arn: "urn:ecs:iam:::policy/ECSS3ReadOnlyAccess"

# Trust policy (assume role policy document)
# ObjectScale requires AWS or Federated principal (not Service)
assume_role_policy_document:
  Version: "2012-10-17"
  Statement:
    - Effect: Allow
      Principal:
        AWS:
          - "urn:ecs:iam::ns1:user/testaccpreq"
      Action: "sts:AssumeRole"

# Inline policy definitions
inline_policy_name: "AllowListBuckets"
inline_policy_document: >-
  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListAllMyBuckets","Resource":"*"}]}
