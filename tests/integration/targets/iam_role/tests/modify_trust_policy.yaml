---
# ============================================================================
# modify_trust_policy.yaml — Trust policy (assume role policy) management tests
# TC-17: Update trust policy (4-phase)
# TC-18: Verify via iam_role_info
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_role:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_role_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # Setup: create a role for trust policy tests
    # ==================================================================
    - name: "Trust policy tests — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"

    - name: "Trust policy tests — Create role"
      ansible.builtin.include_tasks: _helper_create_role.yaml
      vars:
        helper_role_name: "{{ iam_role_name }}"

    # ==================================================================
    # TC-17: Update trust policy (4-phase)
    # ==================================================================
    - name: "TC-17 Phase 1 — Update trust policy (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS:
                  - "urn:ecs:iam::ns1:user/sample_user_1"
              Action: "sts:AssumeRole"
      check_mode: true
      register: tc17_check

    - name: "TC-17 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc17_check.changed == true
        fail_msg: "TC-17 Phase 1 FAILED: check mode should report changed for updated trust policy"
        success_msg: "TC-17 Phase 1 PASSED"

    - name: "TC-17 Phase 2 — Update trust policy (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS:
                  - "urn:ecs:iam::ns1:user/sample_user_1"
              Action: "sts:AssumeRole"
      register: tc17_apply

    - name: "TC-17 Phase 2 — Assert trust policy updated"
      ansible.builtin.assert:
        that:
          - tc17_apply.changed == true
        fail_msg: "TC-17 Phase 2 FAILED: trust policy update should report changed"
        success_msg: "TC-17 Phase 2 PASSED"

    - name: "TC-17 Phase 3 — Re-run same trust policy (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS:
                  - "urn:ecs:iam::ns1:user/sample_user_1"
              Action: "sts:AssumeRole"
      check_mode: true
      register: tc17_check_idem

    - name: "TC-17 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc17_check_idem.changed == false
        fail_msg: "TC-17 Phase 3 FAILED: same trust policy should be idempotent in check mode"
        success_msg: "TC-17 Phase 3 PASSED"

    - name: "TC-17 Phase 4 — Re-run same trust policy (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS:
                  - "urn:ecs:iam::ns1:user/sample_user_1"
              Action: "sts:AssumeRole"
      register: tc17_idem

    - name: "TC-17 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc17_idem.changed == false
        fail_msg: "TC-17 Phase 4 FAILED: same trust policy should be idempotent"
        success_msg: "TC-17 Phase 4 PASSED"

    # ==================================================================
    # TC-18: Verify trust policy via iam_role_info
    # ==================================================================
    - name: "TC-18 — Retrieve role info"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
      register: tc18_info

    - name: "TC-18 — Assert role info contains trust policy"
      ansible.builtin.assert:
        that:
          - tc18_info.iam_roles | length == 1
          - tc18_info.iam_roles[0].RoleName == iam_role_name
          - tc18_info.iam_roles[0].AssumeRolePolicyDocument is defined
        fail_msg: "TC-18 FAILED: role info should contain trust policy document"
        success_msg: "TC-18 PASSED"

  always:
    - name: "Cleanup — Remove test role"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"
