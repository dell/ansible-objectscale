---
# ============================================================================
# create.yaml — IAM Role creation tests
# TC-01: Create basic role with trust policy (4-phase)
# TC-02: Create role with tags (4-phase)
# TC-03: Create role with description + max_session_duration (4-phase)
# TC-04: Create role with diff mode
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_role:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_role_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # TC-01: Create basic role with trust policy (4-phase)
    # ==================================================================
    - name: "TC-01 — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"

    - name: "TC-01 Phase 1 — Create basic role (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
      check_mode: true
      register: tc01_check

    - name: "TC-01 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc01_check.changed == true
        fail_msg: "TC-01 Phase 1 FAILED: check mode should report changed for new role"
        success_msg: "TC-01 Phase 1 PASSED"

    - name: "TC-01 Phase 2 — Create basic role (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
      register: tc01_apply

    - name: "TC-01 Phase 2 — Assert role created"
      ansible.builtin.assert:
        that:
          - tc01_apply.changed == true
          - tc01_apply.role.RoleName == iam_role_name
          - tc01_apply.role.Arn is defined
          - tc01_apply.role.RoleId is defined
        fail_msg: "TC-01 Phase 2 FAILED: role creation did not return expected result"
        success_msg: "TC-01 Phase 2 PASSED"

    - name: "TC-01 Phase 3 — Re-run create (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
      check_mode: true
      register: tc01_check_idem

    - name: "TC-01 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc01_check_idem.changed == false
        fail_msg: "TC-01 Phase 3 FAILED: check mode should report no change for existing role"
        success_msg: "TC-01 Phase 3 PASSED"

    - name: "TC-01 Phase 4 — Re-run create (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
      register: tc01_idem

    - name: "TC-01 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc01_idem.changed == false
        fail_msg: "TC-01 Phase 4 FAILED: second create should not report changed"
        success_msg: "TC-01 Phase 4 PASSED"

    # ==================================================================
    # TC-02: Create role with tags (4-phase)
    # ==================================================================
    - name: "TC-02 — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name_2 }}"

    - name: "TC-02 Phase 1 — Create role with tags (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        tags:
          Department: Engineering
          Environment: IntegrationTest
      check_mode: true
      register: tc02_check

    - name: "TC-02 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc02_check.changed == true
        fail_msg: "TC-02 Phase 1 FAILED: check mode should report changed"
        success_msg: "TC-02 Phase 1 PASSED"

    - name: "TC-02 Phase 2 — Create role with tags (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        tags:
          Department: Engineering
          Environment: IntegrationTest
      register: tc02_apply

    - name: "TC-02 Phase 2 — Assert role created with tags"
      ansible.builtin.assert:
        that:
          - tc02_apply.changed == true
          - tc02_apply.role.RoleName == iam_role_name_2
        fail_msg: "TC-02 Phase 2 FAILED: role creation with tags failed"
        success_msg: "TC-02 Phase 2 PASSED"

    - name: "TC-02 Phase 2 — Verify tags via info module"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_tags: true
      register: tc02_info

    - name: "TC-02 Phase 2 — Assert tags present (via role.Tags from GetRole or role_tags from enrichment)"
      ansible.builtin.assert:
        that:
          - tc02_info.iam_roles | length == 1
        fail_msg: "TC-02 Phase 2 FAILED: role not found"
        success_msg: "TC-02 Phase 2 role verified"

    - name: "TC-02 Phase 3 — Re-run with same tags (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        tags:
          Department: Engineering
          Environment: IntegrationTest
      check_mode: true
      register: tc02_check_idem

    - name: "TC-02 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc02_check_idem.changed == false
        fail_msg: "TC-02 Phase 3 FAILED: same tags should be idempotent in check mode"
        success_msg: "TC-02 Phase 3 PASSED"

    - name: "TC-02 Phase 4 — Re-run with same tags (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        tags:
          Department: Engineering
          Environment: IntegrationTest
      register: tc02_idem

    - name: "TC-02 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc02_idem.changed == false
        fail_msg: "TC-02 Phase 4 FAILED: same tags should be idempotent"
        success_msg: "TC-02 Phase 4 PASSED"

    # ==================================================================
    # TC-03: Create role with description + max_session_duration (4-phase)
    # ==================================================================
    - name: "TC-03 — Pre-cleanup iam_role_name (reuse)"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"

    - name: "TC-03 Phase 1 — Create role with description + max_session_duration (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        description: "Integration test role"
        max_session_duration: 7200
      check_mode: true
      register: tc03_check

    - name: "TC-03 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc03_check.changed == true
        fail_msg: "TC-03 Phase 1 FAILED: check mode should report changed"
        success_msg: "TC-03 Phase 1 PASSED"

    - name: "TC-03 Phase 2 — Create role with description + max_session_duration (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        description: "Integration test role"
        max_session_duration: 7200
      register: tc03_apply

    - name: "TC-03 Phase 2 — Assert role created"
      ansible.builtin.assert:
        that:
          - tc03_apply.changed == true
          - tc03_apply.role.RoleName == iam_role_name
        fail_msg: "TC-03 Phase 2 FAILED: role creation with description failed"
        success_msg: "TC-03 Phase 2 PASSED"

    - name: "TC-03 Phase 3 — Re-run with same params (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        description: "Integration test role"
        max_session_duration: 7200
      check_mode: true
      register: tc03_check_idem

    - name: "TC-03 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc03_check_idem.changed == false
        fail_msg: "TC-03 Phase 3 FAILED: same params should be idempotent in check mode"
        success_msg: "TC-03 Phase 3 PASSED"

    - name: "TC-03 Phase 4 — Re-run with same params (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        description: "Integration test role"
        max_session_duration: 7200
      register: tc03_idem

    - name: "TC-03 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc03_idem.changed == false
        fail_msg: "TC-03 Phase 4 FAILED: same params should be idempotent"
        success_msg: "TC-03 Phase 4 PASSED"

    # ==================================================================
    # TC-04: Create role with diff mode
    # ==================================================================
    - name: "TC-04 — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name_2 }}"

    - name: "TC-04 — Create role with diff mode"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        tags:
          DiffTest: "yes"
      diff: true
      register: tc04_diff

    - name: "TC-04 — Assert diff output present and changed"
      ansible.builtin.assert:
        that:
          - tc04_diff.changed == true
          - tc04_diff.diff is defined or tc04_diff.role is defined
        fail_msg: "TC-04 FAILED: diff mode create did not work"
        success_msg: "TC-04 PASSED"

    - name: "TC-04 — Re-run with diff mode (idempotent)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        tags:
          DiffTest: "yes"
      diff: true
      register: tc04_diff_idem

    - name: "TC-04 — Assert diff mode idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc04_diff_idem.changed == false
        fail_msg: "TC-04 FAILED: diff mode re-run should be idempotent"
        success_msg: "TC-04 idempotent PASSED"

  always:
    - name: "Cleanup — Remove test roles"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ item }}"
      loop:
        - "{{ iam_role_name }}"
        - "{{ iam_role_name_2 }}"
