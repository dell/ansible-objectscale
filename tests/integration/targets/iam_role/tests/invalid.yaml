---
# ============================================================================
# invalid.yaml — Negative / invalid-input tests
# TC-09: Missing required role_name (validated by Ansible framework)
# TC-10: Invalid namespace
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_role:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # TC-09: Missing required role_name
    # Ansible validates required params at framework level. Use
    # block/rescue to verify the expected failure.
    # ==================================================================
    - block:
        - name: "TC-09 — Attempt to create role without role_name"
          dellemc.objectscale.iam_role:
            namespace_name: "{{ objectscale_namespace }}"
            state: present

        - name: "TC-09 — Should not reach here"
          ansible.builtin.fail:
            msg: "TC-09 FAILED: module should have failed for missing role_name"
      rescue:
        - name: "TC-09 — Assert expected failure"
          ansible.builtin.assert:
            that:
              - "'role_name' in ansible_failed_result.msg"
            fail_msg: "TC-09 FAILED: unexpected error message"
            success_msg: "TC-09 PASSED"

    # ==================================================================
    # TC-10: Invalid namespace
    # ==================================================================
    - block:
        - name: "TC-10 — Attempt to create role in non-existent namespace"
          dellemc.objectscale.iam_role:
            role_name: "{{ iam_role_name }}"
            namespace_name: "namespace_does_not_exist_tc10"
            state: present
            assume_role_policy_document: "{{ assume_role_policy_document }}"

        - name: "TC-10 — Should not reach here"
          ansible.builtin.fail:
            msg: "TC-10 FAILED: module should have failed for invalid namespace"
      rescue:
        - name: "TC-10 — Assert expected failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is defined
            fail_msg: "TC-10 FAILED: unexpected error"
            success_msg: "TC-10 PASSED"

  always:
    - name: "Cleanup — Ensure no leftover roles"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"
