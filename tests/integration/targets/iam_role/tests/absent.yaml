---
# ============================================================================
# absent.yaml — IAM Role deletion tests
# TC-05: Delete existing role (4-phase)
# TC-06: Delete non-existent role (no-op, changed=false)
# TC-07: Force delete role with policies attached
# TC-08: Delete with diff mode
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_role:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_role_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # TC-05: Delete existing role (4-phase)
    # ==================================================================
    - name: "TC-05 — Pre-cleanup: force-delete any leftover role"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"

    - name: "TC-05 — Setup: create role to delete"
      ansible.builtin.include_tasks: _helper_create_role.yaml
      vars:
        helper_role_name: "{{ iam_role_name }}"

    - name: "TC-05 Phase 1 — Delete role (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      check_mode: true
      register: tc05_check

    - name: "TC-05 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc05_check.changed == true
        fail_msg: "TC-05 Phase 1 FAILED: check mode should report changed for existing role"
        success_msg: "TC-05 Phase 1 PASSED"

    - name: "TC-05 Phase 1 — Verify role still exists (check mode is dry-run)"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
      register: tc05_still_exists

    - name: "TC-05 Phase 1 — Assert role was NOT deleted by check mode"
      ansible.builtin.assert:
        that:
          - tc05_still_exists.iam_roles | length == 1
        fail_msg: "TC-05 Phase 1 FAILED: check mode should not have deleted the role"
        success_msg: "TC-05 Phase 1 verified — role still exists"

    - name: "TC-05 Phase 2 — Delete role (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc05_apply

    - name: "TC-05 Phase 2 — Assert role deleted"
      ansible.builtin.assert:
        that:
          - tc05_apply.changed == true
        fail_msg: "TC-05 Phase 2 FAILED: delete should report changed"
        success_msg: "TC-05 Phase 2 PASSED"

    - name: "TC-05 Phase 3 — Re-run delete (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      check_mode: true
      register: tc05_check_idem

    - name: "TC-05 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc05_check_idem.changed == false
        fail_msg: "TC-05 Phase 3 FAILED: check mode should report no change for absent role"
        success_msg: "TC-05 Phase 3 PASSED"

    - name: "TC-05 Phase 4 — Re-run delete (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc05_idem

    - name: "TC-05 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc05_idem.changed == false
        fail_msg: "TC-05 Phase 4 FAILED: deleting non-existent role should be idempotent"
        success_msg: "TC-05 Phase 4 PASSED"

    # ==================================================================
    # TC-06: Delete non-existent role (no-op, changed=false)
    # ==================================================================
    - name: "TC-06 — Pre-cleanup (ensure role does not exist)"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "nonexistent_role_tc06"

    - name: "TC-06 — Delete non-existent role"
      dellemc.objectscale.iam_role:
        role_name: "nonexistent_role_tc06"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc06_result

    - name: "TC-06 — Assert no change for non-existent role"
      ansible.builtin.assert:
        that:
          - tc06_result.changed == false
        fail_msg: "TC-06 FAILED: deleting non-existent role should report changed=false"
        success_msg: "TC-06 PASSED"

    # ==================================================================
    # TC-07: Force delete role with policies attached
    # ==================================================================
    - name: "TC-07 — Setup: create role"
      ansible.builtin.include_tasks: _helper_create_role.yaml
      vars:
        helper_role_name: "{{ iam_role_name_2 }}"

    - name: "TC-07 — Setup: attach managed policy to role"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        assume_role_policy_document: "{{ assume_role_policy_document }}"
        managed_policies:
          - "{{ managed_policy_arn }}"
      register: tc07_attach

    - name: "TC-07 — Assert policy attached"
      ansible.builtin.assert:
        that:
          - tc07_attach.changed == true
        fail_msg: "TC-07 setup FAILED: managed policy not attached"
        success_msg: "TC-07 setup — managed policy attached"

    - name: "TC-07 — Force delete role with dependencies"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
        force_delete: true
      register: tc07_force

    - name: "TC-07 — Assert force delete succeeded"
      ansible.builtin.assert:
        that:
          - tc07_force.changed == true
        fail_msg: "TC-07 FAILED: force delete should succeed"
        success_msg: "TC-07 PASSED"

    - name: "TC-07 — Verify role is gone (idempotent delete)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc07_verify

    - name: "TC-07 — Assert role no longer exists"
      ansible.builtin.assert:
        that:
          - tc07_verify.changed == false
        fail_msg: "TC-07 FAILED: role should have been deleted"
        success_msg: "TC-07 verified — role is gone"

    # ==================================================================
    # TC-08: Delete with diff mode
    # ==================================================================
    - name: "TC-08 — Setup: create role"
      ansible.builtin.include_tasks: _helper_create_role.yaml
      vars:
        helper_role_name: "{{ iam_role_name }}"

    - name: "TC-08 — Delete with diff mode"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      diff: true
      register: tc08_diff

    - name: "TC-08 — Assert diff output present and changed"
      ansible.builtin.assert:
        that:
          - tc08_diff.changed == true
        fail_msg: "TC-08 FAILED: diff mode delete should report changed"
        success_msg: "TC-08 PASSED"

    - name: "TC-08 — Re-run diff mode delete (idempotent)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      diff: true
      register: tc08_diff_idem

    - name: "TC-08 — Assert diff mode idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc08_diff_idem.changed == false
        fail_msg: "TC-08 FAILED: diff mode re-run should be idempotent"
        success_msg: "TC-08 idempotent PASSED"

  always:
    - name: "Cleanup — Remove test roles"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ item }}"
      loop:
        - "{{ iam_role_name }}"
        - "{{ iam_role_name_2 }}"
        - "nonexistent_role_tc06"
