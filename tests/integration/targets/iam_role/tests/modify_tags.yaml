---
# ============================================================================
# modify_tags.yaml — Tag management tests
# TC-11: Add tags to existing role (4-phase)
# TC-12: Update tag value (4-phase)
# TC-13: Purge extra tags (purge_tags=true)
# TC-14: Keep extra tags (purge_tags=false)
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_role:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_role_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # Setup: create a bare role for tag tests
    # ==================================================================
    - name: "Tag tests — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"

    - name: "Tag tests — Create bare role"
      ansible.builtin.include_tasks: _helper_create_role.yaml
      vars:
        helper_role_name: "{{ iam_role_name }}"

    # ==================================================================
    # TC-11: Add tags to existing role (4-phase)
    # ==================================================================
    - name: "TC-11 Phase 1 — Add tags (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: IntegrationTest
      check_mode: true
      register: tc11_check

    - name: "TC-11 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc11_check.changed == true
        fail_msg: "TC-11 Phase 1 FAILED: check mode should report changed when adding tags"
        success_msg: "TC-11 Phase 1 PASSED"

    - name: "TC-11 Phase 2 — Add tags (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: IntegrationTest
      register: tc11_apply

    - name: "TC-11 Phase 2 — Assert tags added"
      ansible.builtin.assert:
        that:
          - tc11_apply.changed == true
        fail_msg: "TC-11 Phase 2 FAILED: tags should have been added"
        success_msg: "TC-11 Phase 2 PASSED"

    - name: "TC-11 Phase 2 — Verify tags via info module"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_tags: true
      register: tc11_info

    - name: "TC-11 Phase 2 — Assert tags are present"
      ansible.builtin.assert:
        that:
          - tc11_info.iam_roles[0].role_tags | length == 2
        fail_msg: "TC-11 Phase 2 FAILED: expected 2 tags on role"
        success_msg: "TC-11 Phase 2 tags verified"

    - name: "TC-11 Phase 3 — Re-run same tags (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: IntegrationTest
      check_mode: true
      register: tc11_check_idem

    - name: "TC-11 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc11_check_idem.changed == false
        fail_msg: "TC-11 Phase 3 FAILED: same tags should be idempotent in check mode"
        success_msg: "TC-11 Phase 3 PASSED"

    - name: "TC-11 Phase 4 — Re-run same tags (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: IntegrationTest
      register: tc11_idem

    - name: "TC-11 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc11_idem.changed == false
        fail_msg: "TC-11 Phase 4 FAILED: same tags should be idempotent"
        success_msg: "TC-11 Phase 4 PASSED"

    # ==================================================================
    # TC-12: Update tag value (4-phase)
    # ==================================================================
    - name: "TC-12 Phase 1 — Update tag value (check mode)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: Production
      check_mode: true
      register: tc12_check

    - name: "TC-12 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc12_check.changed == true
        fail_msg: "TC-12 Phase 1 FAILED: check mode should report changed for updated tag value"
        success_msg: "TC-12 Phase 1 PASSED"

    - name: "TC-12 Phase 2 — Update tag value (apply)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: Production
      register: tc12_apply

    - name: "TC-12 Phase 2 — Assert tag updated"
      ansible.builtin.assert:
        that:
          - tc12_apply.changed == true
        fail_msg: "TC-12 Phase 2 FAILED: tag value update should report changed"
        success_msg: "TC-12 Phase 2 PASSED"

    - name: "TC-12 Phase 2 — Verify updated tag via info"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_tags: true
      register: tc12_info

    - name: "TC-12 Phase 2 — Assert Environment tag is now Production"
      ansible.builtin.assert:
        that:
          - >-
            (tc12_info.iam_roles[0].role_tags |
             selectattr('Key', 'equalto', 'Environment') |
             map(attribute='Value') | first) == 'Production'
        fail_msg: "TC-12 Phase 2 FAILED: Environment tag should be Production"
        success_msg: "TC-12 Phase 2 tag value verified"

    - name: "TC-12 Phase 3 — Re-run updated tags (check mode, no changes expected)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: Production
      check_mode: true
      register: tc12_check_idem

    - name: "TC-12 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc12_check_idem.changed == false
        fail_msg: "TC-12 Phase 3 FAILED: same updated tags should be idempotent"
        success_msg: "TC-12 Phase 3 PASSED"

    - name: "TC-12 Phase 4 — Re-run updated tags (idempotence)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
          Environment: Production
      register: tc12_idem

    - name: "TC-12 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc12_idem.changed == false
        fail_msg: "TC-12 Phase 4 FAILED: same updated tags should be idempotent"
        success_msg: "TC-12 Phase 4 PASSED"

    # ==================================================================
    # TC-13: Purge extra tags (purge_tags=true, default)
    # Role currently has: Department=Engineering, Environment=Production
    # Desired: only Department=Engineering → Environment should be purged
    # ==================================================================
    - name: "TC-13 — Purge tags to single tag (purge_tags=true)"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
        purge_tags: true
      register: tc13_purge

    - name: "TC-13 — Assert purge reported changed"
      ansible.builtin.assert:
        that:
          - tc13_purge.changed == true
        fail_msg: "TC-13 FAILED: purge should report changed"
        success_msg: "TC-13 PASSED"

    - name: "TC-13 — Verify only one tag remains"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_tags: true
      register: tc13_info

    - name: "TC-13 — Assert exactly 1 tag left"
      ansible.builtin.assert:
        that:
          - tc13_info.iam_roles[0].role_tags | length == 1
          - >-
            (tc13_info.iam_roles[0].role_tags |
             selectattr('Key', 'equalto', 'Department') | list | length) == 1
        fail_msg: "TC-13 FAILED: should have exactly 1 tag (Department)"
        success_msg: "TC-13 purge verified"

    - name: "TC-13 — Idempotent purge re-run"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Department: Engineering
        purge_tags: true
      register: tc13_idem

    - name: "TC-13 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc13_idem.changed == false
        fail_msg: "TC-13 FAILED: purge re-run should be idempotent"
        success_msg: "TC-13 idempotent PASSED"

    # ==================================================================
    # TC-14: Keep extra tags (purge_tags=false)
    # Role currently has: Department=Engineering
    # Add Project=TestProject with purge_tags=false → both should remain
    # ==================================================================
    - name: "TC-14 — Add tag with purge_tags=false"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Project: TestProject
        purge_tags: false
      register: tc14_add

    - name: "TC-14 — Assert tag added (changed=true)"
      ansible.builtin.assert:
        that:
          - tc14_add.changed == true
        fail_msg: "TC-14 FAILED: adding new tag should report changed"
        success_msg: "TC-14 PASSED"

    - name: "TC-14 — Verify both tags present"
      dellemc.objectscale.iam_role_info:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_tags: true
      register: tc14_info

    - name: "TC-14 — Assert 2 tags present (old + new)"
      ansible.builtin.assert:
        that:
          - tc14_info.iam_roles[0].role_tags | length == 2
          - >-
            (tc14_info.iam_roles[0].role_tags |
             selectattr('Key', 'equalto', 'Department') | list | length) == 1
          - >-
            (tc14_info.iam_roles[0].role_tags |
             selectattr('Key', 'equalto', 'Project') | list | length) == 1
        fail_msg: "TC-14 FAILED: both Department and Project tags should exist"
        success_msg: "TC-14 verified — both tags present"

    - name: "TC-14 — Idempotent re-run with purge_tags=false"
      dellemc.objectscale.iam_role:
        role_name: "{{ iam_role_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        tags:
          Project: TestProject
        purge_tags: false
      register: tc14_idem

    - name: "TC-14 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc14_idem.changed == false
        fail_msg: "TC-14 FAILED: purge_tags=false re-run should be idempotent"
        success_msg: "TC-14 idempotent PASSED"

  always:
    - name: "Cleanup — Remove test role"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_role_name: "{{ iam_role_name }}"
