---
- name: Test that we have required variables
  ansible.builtin.fail:
    msg: "Please define the following variables: objectscale_host, objectscale_username, objectscale_password, objectscale_namespace."
  when: >-
    objectscale_host is not defined or
    objectscale_username is not defined or
    objectscale_password is not defined or
    objectscale_namespace is not defined

# =====================================================================
# TC-19  Delete an empty group
# =====================================================================
- block:
    # Setup: create a bare group
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    # ---- Phase 1: Check mode — changes expected ----
    - name: TC-19 Delete IAM group (check mode - changes expected)
      dellemc.objectscale.iam_group: &delete_group
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: absent
      check_mode: true
      register: cm_changes

    # ---- Phase 2: Normal mode ----
    - name: TC-19 Delete IAM group (normal mode)
      dellemc.objectscale.iam_group:
        <<: *delete_group
      register: result

    # ---- Phase 3: Check mode — no changes expected (already deleted) ----
    - name: TC-19 Delete IAM group (check mode - no changes expected)
      dellemc.objectscale.iam_group:
        <<: *delete_group
      check_mode: true
      register: cm_no_changes

    # ---- Phase 4: Idempotence (delete non-existent group) ----
    - name: TC-19 Delete IAM group (idempotence)
      dellemc.objectscale.iam_group:
        <<: *delete_group
      register: idempotence

    # ---- Verify group is gone via info module ----
    - name: TC-19 Gather IAM group info after delete
      dellemc.objectscale.info:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        objectscale_port: "{{ objectscale_port }}"
        validate_certs: "{{ validate_certs }}"
        gather_subset:
          - iam_group
        namespace: "{{ objectscale_namespace }}"
      register: group_info

    # ---- Assertions ----
    - name: TC-19 Verify delete results
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - not cm_no_changes.changed
          - not idempotence.changed
          - group_info.IamGroups | selectattr('GroupName', 'equalto', group_name) | list | length == 0

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-20  Delete a group that has users, policies and inline policies
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    # Setup: create a fully populated group
    - name: TC-20 Setup - Create group with users, policies and inline policies
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        users:
          - "{{ test_user_1 }}"
          - "{{ test_user_2 }}"
        user_state: present-in-group
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: present-in-group
        inline_policies:
          - name: "{{ inline_policy_name }}"
            document: "{{ inline_policy_document }}"
        inline_policy_state: present-in-group
      register: setup_result

    # Sanity check: verify setup created everything
    - name: TC-20 Verify setup
      ansible.builtin.assert:
        that:
          - setup_result.changed
          - setup_result.iam_group_details.users | length >= 2
          - setup_result.iam_group_details.attached_policies | length >= 1
          - setup_result.iam_group_details.inline_policies | length >= 1

    # ---- Check mode — changes expected ----
    - name: TC-20 Delete populated group (check mode - changes expected)
      dellemc.objectscale.iam_group: &delete_populated
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: absent
      check_mode: true
      register: cm_changes

    # ---- Normal mode — should clean up dependencies and delete ----
    - name: TC-20 Delete populated group (normal mode)
      dellemc.objectscale.iam_group:
        <<: *delete_populated
      register: result

    # ---- Idempotence ----
    - name: TC-20 Delete populated group (idempotence)
      dellemc.objectscale.iam_group:
        <<: *delete_populated
      register: idempotence

    # ---- Assertions ----
    - name: TC-20 Verify populated group deletion
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - not idempotence.changed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-21  Delete a non-existent group (no-op)
# =====================================================================
- block:
    # Make sure the group definitely does not exist
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - name: TC-21 Delete non-existent group (no-op expected)
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: absent
      register: result

    - name: TC-21 Verify no changes
      ansible.builtin.assert:
        that:
          - not result.changed

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-22  Delete with diff mode
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-22 Delete group (diff mode)
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: absent
      diff: true
      register: result_diff

    - name: TC-22 Verify diff output on delete
      ansible.builtin.assert:
        that:
          - result_diff.changed
          - result_diff.diff is defined
          - result_diff.diff.before | length > 0
          - result_diff.diff.before.group_name == group_name
          - result_diff.diff.after | length == 0

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
