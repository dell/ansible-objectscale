---
- name: Test that we have required variables
  ansible.builtin.fail:
    msg: "Please define the following variables: objectscale_host, objectscale_username, objectscale_password, objectscale_namespace."
  when: >-
    objectscale_host is not defined or
    objectscale_username is not defined or
    objectscale_password is not defined or
    objectscale_namespace is not defined

# =====================================================================
# TC-23  Missing required parameter: group_name
# =====================================================================
- block:
    - name: TC-23 Negative - missing group_name
      dellemc.objectscale.iam_group:
        namespace: "{{ objectscale_namespace }}"
        state: present
      ignore_errors: true
      register: invalid_missing_group_name

    - name: TC-23 Verify missing group_name error
      ansible.builtin.assert:
        that:
          - invalid_missing_group_name.failed
          - not invalid_missing_group_name.changed
          - '"missing required arguments: group_name" in invalid_missing_group_name.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-24  Missing required parameter: namespace
# =====================================================================
- block:
    - name: TC-24 Negative - missing namespace
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        state: present
      ignore_errors: true
      register: invalid_missing_namespace

    - name: TC-24 Verify missing namespace error
      ansible.builtin.assert:
        that:
          - invalid_missing_namespace.failed
          - not invalid_missing_namespace.changed
          - '"missing required arguments: namespace" in invalid_missing_namespace.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-25  Missing required parameter: state
# =====================================================================
- block:
    - name: TC-25 Negative - missing state
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
      ignore_errors: true
      register: invalid_missing_state

    - name: TC-25 Verify missing state error
      ansible.builtin.assert:
        that:
          - invalid_missing_state.failed
          - not invalid_missing_state.changed
          - '"missing required arguments: state" in invalid_missing_state.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-26  Invalid state value
# =====================================================================
- block:
    - name: TC-26 Negative - invalid state value
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: "invalid_state"
      ignore_errors: true
      register: invalid_state_value

    - name: TC-26 Verify invalid state error
      ansible.builtin.assert:
        that:
          - invalid_state_value.failed
          - not invalid_state_value.changed
          - '"value of state must be one of: present, absent" in invalid_state_value.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-27  Invalid user_state value
# =====================================================================
- block:
    - name: TC-27 Negative - invalid user_state value
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        users:
          - "{{ test_user_1 }}"
        user_state: "invalid_user_state"
      ignore_errors: true
      register: invalid_user_state

    - name: TC-27 Verify invalid user_state error
      ansible.builtin.assert:
        that:
          - invalid_user_state.failed
          - not invalid_user_state.changed
          - '"value of user_state must be one of: present-in-group, absent-in-group" in invalid_user_state.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-28  Invalid policy_state value
# =====================================================================
- block:
    - name: TC-28 Negative - invalid policy_state value
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: "invalid_policy_state"
      ignore_errors: true
      register: invalid_policy_state

    - name: TC-28 Verify invalid policy_state error
      ansible.builtin.assert:
        that:
          - invalid_policy_state.failed
          - not invalid_policy_state.changed
          - '"value of policy_state must be one of: present-in-group, absent-in-group" in invalid_policy_state.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-29  Unsupported parameter
# =====================================================================
- block:
    - name: TC-29 Negative - unsupported parameter
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        invalid_param: true
      ignore_errors: true
      register: invalid_param

    - name: TC-29 Verify unsupported parameter error
      ansible.builtin.assert:
        that:
          - invalid_param.failed
          - not invalid_param.changed
          - '"Unsupported parameters for (dellemc.objectscale.iam_group) module: invalid_param" in invalid_param.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-30  Invalid credentials
# =====================================================================
- block:
    - name: TC-31 Negative - invalid credentials
      dellemc.objectscale.iam_group:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "invalid_user"
        objectscale_password: "invalid_password"
        objectscale_port: "{{ objectscale_port }}"
        validate_certs: "{{ validate_certs }}"
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
      ignore_errors: true
      register: invalid_creds

    - name: TC-31 Verify invalid credentials error
      ansible.builtin.assert:
        that:
          - invalid_creds.failed
          - not invalid_creds.changed

# =====================================================================
# TC-32  Add non-existent user to a group
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-32 Negative - add non-existent user
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        users:
          - "nonexistent_user_xyz_12345"
        user_state: present-in-group
      ignore_errors: true
      register: invalid_user

    - name: TC-32 Verify non-existent user error
      ansible.builtin.assert:
        that:
          - invalid_user.failed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-33  Attach non-existent managed policy
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-33 Negative - attach non-existent policy
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "urn:ecs:iam:::policy/NonExistentPolicy12345"
        policy_state: present-in-group
      ignore_errors: true
      register: invalid_policy

    - name: TC-33 Verify non-existent policy error
      ansible.builtin.assert:
        that:
          - invalid_policy.failed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-34  Invalid inline_policy_state value
# =====================================================================
- block:
    - name: TC-34 Negative - invalid inline_policy_state value
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "test"
            document: "{}"
        inline_policy_state: "invalid_inline_state"
      ignore_errors: true
      register: invalid_inline_state

    - name: TC-34 Verify invalid inline_policy_state error
      ansible.builtin.assert:
        that:
          - invalid_inline_state.failed
          - not invalid_inline_state.changed
          - '"value of inline_policy_state must be one of: present-in-group, absent-in-group" in invalid_inline_state.msg'

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
