---
- name: Test that we have required variables
  ansible.builtin.fail:
    msg: "Please define the following variables: objectscale_host, objectscale_username, objectscale_password, objectscale_namespace."
  when: >-
    objectscale_host is not defined or
    objectscale_username is not defined or
    objectscale_password is not defined or
    objectscale_namespace is not defined

# =====================================================================
# TC-10  Attach a managed policy to a group
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    # ---- Phase 1: Check mode — changes expected ----
    - name: TC-10 Attach managed policy (check mode - changes expected)
      dellemc.objectscale.iam_group: &attach_policy
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: present-in-group
      check_mode: true
      register: cm_changes

    # ---- Phase 2: Normal mode ----
    - name: TC-10 Attach managed policy (normal mode)
      dellemc.objectscale.iam_group:
        <<: *attach_policy
      register: result

    # ---- Phase 3: Check mode — no changes expected ----
    - name: TC-10 Attach managed policy (check mode - no changes expected)
      dellemc.objectscale.iam_group:
        <<: *attach_policy
      check_mode: true
      register: cm_no_changes

    # ---- Phase 4: Idempotence ----
    - name: TC-10 Attach managed policy (idempotence)
      dellemc.objectscale.iam_group:
        <<: *attach_policy
      register: idempotence

    # ---- Assertions ----
    - name: TC-10 Verify attach managed policy
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - result.iam_group_details.attached_policies | length >= 1
          - managed_policy_arn in (result.iam_group_details.attached_policies | map(attribute='PolicyArn') | list)
          - not cm_no_changes.changed
          - not idempotence.changed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-11  Detach a managed policy from a group
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    # Setup: create group with a policy attached
    - name: TC-11 Setup - Create group with managed policy
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: present-in-group

    # ---- Check mode — detach (changes expected) ----
    - name: TC-11 Detach managed policy (check mode - changes expected)
      dellemc.objectscale.iam_group: &detach_policy
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: absent-in-group
      check_mode: true
      register: cm_changes

    # ---- Normal mode ----
    - name: TC-11 Detach managed policy (normal mode)
      dellemc.objectscale.iam_group:
        <<: *detach_policy
      register: result

    # ---- Check mode — no changes expected ----
    - name: TC-11 Detach managed policy (check mode - no changes expected)
      dellemc.objectscale.iam_group:
        <<: *detach_policy
      check_mode: true
      register: cm_no_changes

    # ---- Idempotence ----
    - name: TC-11 Detach managed policy (idempotence)
      dellemc.objectscale.iam_group:
        <<: *detach_policy
      register: idempotence

    # ---- Assertions ----
    - name: TC-11 Verify detach managed policy
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - managed_policy_arn not in (result.iam_group_details.attached_policies | map(attribute='PolicyArn', default='') | list)
          - not cm_no_changes.changed
          - not idempotence.changed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-12  Detach a policy that is not attached (no-op)
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-12 Detach non-attached policy (no-op expected)
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: absent-in-group
      register: result

    - name: TC-12 Verify no changes
      ansible.builtin.assert:
        that:
          - not result.changed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-13  Policy modification with diff mode
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-13 Attach managed policy (diff mode)
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        policies:
          - "{{ managed_policy_arn }}"
        policy_state: present-in-group
      diff: true
      register: result_diff

    - name: TC-13 Verify diff output on policy attach
      ansible.builtin.assert:
        that:
          - result_diff.changed
          - result_diff.diff is defined
          - result_diff.diff.before.attached_policies | length == 0
          - result_diff.diff.after.attached_policies | length >= 1

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
