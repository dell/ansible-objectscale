---
- name: Test that we have required variables
  ansible.builtin.fail:
    msg: "Please define the following variables: objectscale_host, objectscale_username, objectscale_password, objectscale_namespace."
  when: >-
    objectscale_host is not defined or
    objectscale_username is not defined or
    objectscale_password is not defined or
    objectscale_namespace is not defined

# =====================================================================
# TC-14  Add an inline policy to a group
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    # ---- Phase 1: Check mode — changes expected ----
    - name: TC-14 Add inline policy (check mode - changes expected)
      dellemc.objectscale.iam_group: &add_inline
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "{{ inline_policy_name }}"
            document: "{{ inline_policy_document }}"
        inline_policy_state: present-in-group
      check_mode: true
      register: cm_changes

    # ---- Phase 2: Normal mode ----
    - name: TC-14 Add inline policy (normal mode)
      dellemc.objectscale.iam_group:
        <<: *add_inline
      register: result

    # ---- Phase 3: Idempotence ----
    - name: TC-14 Add inline policy (idempotence)
      dellemc.objectscale.iam_group:
        <<: *add_inline
      register: idempotence

    # ---- Assertions ----
    - name: TC-14 Verify inline policy added
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - inline_policy_name in result.iam_group_details.inline_policies

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-15  Add multiple inline policies
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-15 Add multiple inline policies (check mode - changes expected)
      dellemc.objectscale.iam_group: &add_multi_inline
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "{{ inline_policy_name }}"
            document: "{{ inline_policy_document }}"
          - name: "{{ inline_policy_name_2 }}"
            document: "{{ inline_policy_document_2 }}"
        inline_policy_state: present-in-group
      check_mode: true
      register: cm_changes

    - name: TC-15 Add multiple inline policies (normal mode)
      dellemc.objectscale.iam_group:
        <<: *add_multi_inline
      register: result

    - name: TC-15 Verify multiple inline policies
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - inline_policy_name in result.iam_group_details.inline_policies
          - inline_policy_name_2 in result.iam_group_details.inline_policies
          - result.iam_group_details.inline_policies | length >= 2

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-16  Remove an inline policy from a group
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    # Setup: create group with inline policy
    - name: TC-16 Setup - Create group with inline policy
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "{{ inline_policy_name }}"
            document: "{{ inline_policy_document }}"
          - name: "{{ inline_policy_name_2 }}"
            document: "{{ inline_policy_document_2 }}"
        inline_policy_state: present-in-group

    # ---- Check mode — remove one inline policy (changes expected) ----
    - name: TC-16 Remove inline policy (check mode - changes expected)
      dellemc.objectscale.iam_group: &remove_inline
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "{{ inline_policy_name_2 }}"
        inline_policy_state: absent-in-group
      check_mode: true
      register: cm_changes

    # ---- Normal mode ----
    - name: TC-16 Remove inline policy (normal mode)
      dellemc.objectscale.iam_group:
        <<: *remove_inline
      register: result

    # ---- Check mode — no changes expected ----
    - name: TC-16 Remove inline policy (check mode - no changes expected)
      dellemc.objectscale.iam_group:
        <<: *remove_inline
      check_mode: true
      register: cm_no_changes

    # ---- Idempotence ----
    - name: TC-16 Remove inline policy (idempotence)
      dellemc.objectscale.iam_group:
        <<: *remove_inline
      register: idempotence

    # ---- Assertions ----
    - name: TC-16 Verify inline policy removal
      ansible.builtin.assert:
        that:
          - cm_changes.changed
          - result.changed
          - inline_policy_name in result.iam_group_details.inline_policies
          - inline_policy_name_2 not in result.iam_group_details.inline_policies
          - not cm_no_changes.changed
          - not idempotence.changed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-17  Remove an inline policy that does not exist (no-op)
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-17 Remove non-existent inline policy (no-op expected)
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "nonexistent_policy"
        inline_policy_state: absent-in-group
      register: result

    - name: TC-17 Verify no changes
      ansible.builtin.assert:
        that:
          - not result.changed

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"

# =====================================================================
# TC-18  Inline policy with diff mode
# =====================================================================
- block:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_create_group.yaml"
      vars:
        helper_group_name: "{{ group_name }}"

    - name: TC-18 Add inline policy (diff mode)
      dellemc.objectscale.iam_group:
        group_name: "{{ group_name }}"
        namespace: "{{ objectscale_namespace }}"
        state: present
        inline_policies:
          - name: "{{ inline_policy_name }}"
            document: "{{ inline_policy_document }}"
        inline_policy_state: present-in-group
      diff: true
      register: result_diff

    - name: TC-18 Verify diff output on inline policy add
      ansible.builtin.assert:
        that:
          - result_diff.changed
          - result_diff.diff is defined
          - result_diff.diff.before.inline_policies | length == 0
          - result_diff.diff.after.inline_policies | length >= 1

  always:
    - ansible.builtin.include_tasks: "{{ role_path }}/tests/_helper_cleanup.yaml"
      vars:
        cleanup_group_name: "{{ group_name }}"

  module_defaults:
    dellemc.objectscale.iam_group:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
