---
# ---------------------------------------------------------------------------
# Test variables for iam_group functional tests
# ---------------------------------------------------------------------------

# Group names used across test cases
group_name: "osam_test_group"
group_name_with_path: "osam_test_group_path"

# IAM path prefix (used during group creation)
# NOTE: ObjectScale only supports path: "/" — custom paths are not allowed.
group_path: "/"

# IAM users that must already exist in the target namespace
test_user_1: "user_001"
test_user_2: "sample_user_1"

# Managed policy ARN that must exist on the ObjectScale system
managed_policy_arn: "urn:ecs:iam:::policy/ECSS3ReadOnlyAccess"

# Inline policy definitions
inline_policy_name: "AllowListBuckets"
inline_policy_document: >-
  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:ListAllMyBuckets","Resource":"*"}]}

inline_policy_name_2: "AllowGetObject"
inline_policy_document_2: >-
  {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"*"}]}
