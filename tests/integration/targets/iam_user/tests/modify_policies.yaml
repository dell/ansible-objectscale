---
# ============================================================================
# modify_policies.yaml — Policy management tests
# TC-15: Attach managed policy (4-phase)
# TC-16: Purge managed policies
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_user:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_user_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # Setup: create user for policy tests
    # ==================================================================
    - name: "Policy tests — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"

    - name: "Policy tests — Create user"
      ansible.builtin.include_tasks: _helper_create_user.yaml
      vars:
        helper_user_name: "{{ user_name }}"

    # ==================================================================
    # TC-15: Attach managed policy (4-phase)
    # ==================================================================
    - name: "TC-15 Phase 1 — Attach managed policy (check mode)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        managed_policies:
          - "{{ managed_policy_arn }}"
      check_mode: true
      register: tc15_check

    - name: "TC-15 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc15_check.changed == true
        fail_msg: "TC-15 Phase 1 FAILED: check mode should report changed for new policy attachment"
        success_msg: "TC-15 Phase 1 PASSED"

    - name: "TC-15 Phase 2 — Attach managed policy (apply)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        managed_policies:
          - "{{ managed_policy_arn }}"
      register: tc15_apply

    - name: "TC-15 Phase 2 — Assert policy attached"
      ansible.builtin.assert:
        that:
          - tc15_apply.changed == true
        fail_msg: "TC-15 Phase 2 FAILED: policy attachment should report changed"
        success_msg: "TC-15 Phase 2 PASSED"

    - name: "TC-15 Phase 2 — Verify policy via info module"
      dellemc.objectscale.iam_user_info:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_attached_policies: true
      register: tc15_info

    - name: "TC-15 Phase 2 — Assert policy is attached"
      ansible.builtin.assert:
        that:
          - tc15_info.iam_users[0].attached_policies | length >= 1
          - >-
            managed_policy_arn in
            (tc15_info.iam_users[0].attached_policies | map(attribute='PolicyArn') | list)
        fail_msg: "TC-15 Phase 2 FAILED: managed policy not found on user"
        success_msg: "TC-15 Phase 2 policy verified"

    - name: "TC-15 Phase 3 — Re-run same policy (check mode, no changes expected)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        managed_policies:
          - "{{ managed_policy_arn }}"
      check_mode: true
      register: tc15_check_idem

    - name: "TC-15 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc15_check_idem.changed == false
        fail_msg: "TC-15 Phase 3 FAILED: same policy should be idempotent in check mode"
        success_msg: "TC-15 Phase 3 PASSED"

    - name: "TC-15 Phase 4 — Re-run same policy (idempotence)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        managed_policies:
          - "{{ managed_policy_arn }}"
      register: tc15_idem

    - name: "TC-15 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc15_idem.changed == false
        fail_msg: "TC-15 Phase 4 FAILED: same policy should be idempotent"
        success_msg: "TC-15 Phase 4 PASSED"

    # ==================================================================
    # TC-16: Purge managed policies
    # User currently has managed_policy_arn attached.
    # Set managed_policies=[] with purge_managed_policies=true → detach all.
    # ==================================================================
    - name: "TC-16 — Purge all managed policies"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        managed_policies: []
        purge_managed_policies: true
      register: tc16_purge

    - name: "TC-16 — Assert purge reported changed"
      ansible.builtin.assert:
        that:
          - tc16_purge.changed == true
        fail_msg: "TC-16 FAILED: purge should report changed"
        success_msg: "TC-16 PASSED"

    - name: "TC-16 — Verify no policies attached"
      dellemc.objectscale.iam_user_info:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_attached_policies: true
      register: tc16_info

    - name: "TC-16 — Assert zero policies"
      ansible.builtin.assert:
        that:
          - tc16_info.iam_users[0].attached_policies | length == 0
        fail_msg: "TC-16 FAILED: all policies should have been purged"
        success_msg: "TC-16 purge verified"

    - name: "TC-16 — Idempotent purge re-run"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        managed_policies: []
        purge_managed_policies: true
      register: tc16_idem

    - name: "TC-16 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc16_idem.changed == false
        fail_msg: "TC-16 FAILED: purge re-run should be idempotent"
        success_msg: "TC-16 idempotent PASSED"

  always:
    - name: "Cleanup — Remove test user"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"
