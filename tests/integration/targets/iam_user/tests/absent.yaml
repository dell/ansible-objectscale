---
# ============================================================================
# absent.yaml — IAM User deletion tests
# TC-05: Delete existing user (4-phase)
# TC-06: Delete non-existent user (no-op, changed=false)
# TC-07: Force delete user with access key
# TC-08: Delete with diff mode
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_user:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_user_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # TC-05: Delete existing user (4-phase)
    # ==================================================================
    - name: "TC-05 — Pre-cleanup: force-delete any leftover user"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"

    - name: "TC-05 — Setup: create user to delete"
      ansible.builtin.include_tasks: _helper_create_user.yaml
      vars:
        helper_user_name: "{{ user_name }}"

    - name: "TC-05 Phase 1 — Delete user (check mode)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      check_mode: true
      register: tc05_check

    - name: "TC-05 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc05_check.changed == true
        fail_msg: "TC-05 Phase 1 FAILED: check mode should report changed for existing user"
        success_msg: "TC-05 Phase 1 PASSED"

    - name: "TC-05 Phase 1 — Verify user still exists (check mode is dry-run)"
      dellemc.objectscale.iam_user_info:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
      register: tc05_still_exists

    - name: "TC-05 Phase 1 — Assert user was NOT deleted by check mode"
      ansible.builtin.assert:
        that:
          - tc05_still_exists.iam_users | length == 1
        fail_msg: "TC-05 Phase 1 FAILED: check mode should not have deleted the user"
        success_msg: "TC-05 Phase 1 verified — user still exists"

    - name: "TC-05 Phase 2 — Delete user (apply)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc05_apply

    - name: "TC-05 Phase 2 — Assert user deleted"
      ansible.builtin.assert:
        that:
          - tc05_apply.changed == true
        fail_msg: "TC-05 Phase 2 FAILED: delete should report changed"
        success_msg: "TC-05 Phase 2 PASSED"

    - name: "TC-05 Phase 3 — Re-run delete (check mode, no changes expected)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      check_mode: true
      register: tc05_check_idem

    - name: "TC-05 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc05_check_idem.changed == false
        fail_msg: "TC-05 Phase 3 FAILED: check mode should report no change for absent user"
        success_msg: "TC-05 Phase 3 PASSED"

    - name: "TC-05 Phase 4 — Re-run delete (idempotence)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc05_idem

    - name: "TC-05 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc05_idem.changed == false
        fail_msg: "TC-05 Phase 4 FAILED: deleting non-existent user should be idempotent"
        success_msg: "TC-05 Phase 4 PASSED"

    # ==================================================================
    # TC-06: Delete non-existent user (no-op, changed=false)
    # ==================================================================
    - name: "TC-06 — Pre-cleanup (ensure user does not exist)"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "nonexistent_user_tc06"

    - name: "TC-06 — Delete non-existent user"
      dellemc.objectscale.iam_user:
        user_name: "nonexistent_user_tc06"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc06_result

    - name: "TC-06 — Assert no change for non-existent user"
      ansible.builtin.assert:
        that:
          - tc06_result.changed == false
        fail_msg: "TC-06 FAILED: deleting non-existent user should report changed=false"
        success_msg: "TC-06 PASSED"

    # ==================================================================
    # TC-07: Force delete user with access key
    # ==================================================================
    - name: "TC-07 — Setup: create user"
      ansible.builtin.include_tasks: _helper_create_user.yaml
      vars:
        helper_user_name: "{{ user_name_2 }}"

    - name: "TC-07 — Setup: create access key on user"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_state: present
      register: tc07_key

    - name: "TC-07 — Assert access key created"
      ansible.builtin.assert:
        that:
          - tc07_key.changed == true
          - tc07_key.access_key.AccessKeyId is defined
        fail_msg: "TC-07 setup FAILED: access key not created"
        success_msg: "TC-07 setup — access key created"

    - name: "TC-07 — Force delete user with dependencies"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
        force_delete: true
      register: tc07_force

    - name: "TC-07 — Assert force delete succeeded"
      ansible.builtin.assert:
        that:
          - tc07_force.changed == true
        fail_msg: "TC-07 FAILED: force delete should succeed"
        success_msg: "TC-07 PASSED"

    - name: "TC-07 — Verify user is gone (idempotent delete)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name_2 }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      register: tc07_verify

    - name: "TC-07 — Assert user no longer exists"
      ansible.builtin.assert:
        that:
          - tc07_verify.changed == false
        fail_msg: "TC-07 FAILED: user should have been deleted"
        success_msg: "TC-07 verified — user is gone"

    # ==================================================================
    # TC-08: Delete with diff mode
    # ==================================================================
    - name: "TC-08 — Setup: create user"
      ansible.builtin.include_tasks: _helper_create_user.yaml
      vars:
        helper_user_name: "{{ user_name }}"

    - name: "TC-08 — Delete with diff mode"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      diff: true
      register: tc08_diff

    - name: "TC-08 — Assert diff output present and changed"
      ansible.builtin.assert:
        that:
          - tc08_diff.changed == true
        fail_msg: "TC-08 FAILED: diff mode delete should report changed"
        success_msg: "TC-08 PASSED"

    - name: "TC-08 — Re-run diff mode delete (idempotent)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: absent
      diff: true
      register: tc08_diff_idem

    - name: "TC-08 — Assert diff mode idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc08_diff_idem.changed == false
        fail_msg: "TC-08 FAILED: diff mode re-run should be idempotent"
        success_msg: "TC-08 idempotent PASSED"

  always:
    - name: "Cleanup — Remove test users"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ item }}"
      loop:
        - "{{ user_name }}"
        - "{{ user_name_2 }}"
        - "nonexistent_user_tc06"
