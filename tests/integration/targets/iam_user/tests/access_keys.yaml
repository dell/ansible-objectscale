---
# ============================================================================
# access_keys.yaml — Access key management tests
# TC-19: Create access key
# TC-20: Deactivate access key (Active→Inactive)
# TC-21: Idempotent key status
# TC-22: Delete access key
# TC-23: Verify with iam_user_info include_access_keys
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_user:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_user_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # Setup: create user for access key tests
    # ==================================================================
    - name: "Access key tests — Pre-cleanup"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"

    - name: "Access key tests — Create user"
      ansible.builtin.include_tasks: _helper_create_user.yaml
      vars:
        helper_user_name: "{{ user_name }}"

    # ==================================================================
    # TC-19: Create access key
    # ==================================================================
    - name: "TC-19 Phase 1 — Create access key (check mode)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_state: present
      check_mode: true
      register: tc19_check

    - name: "TC-19 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc19_check.changed == true
        fail_msg: "TC-19 Phase 1 FAILED: check mode should report changed for new access key"
        success_msg: "TC-19 Phase 1 PASSED"

    - name: "TC-19 Phase 2 — Create access key (apply)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_state: present
      register: tc19_apply

    - name: "TC-19 Phase 2 — Assert access key created"
      ansible.builtin.assert:
        that:
          - tc19_apply.changed == true
          - tc19_apply.access_key is defined
          - tc19_apply.access_key.AccessKeyId is defined
          - tc19_apply.access_key.SecretAccessKey is defined
          - tc19_apply.access_key.Status == "Active"
        fail_msg: "TC-19 Phase 2 FAILED: access key not created properly"
        success_msg: "TC-19 Phase 2 PASSED"

    - name: "TC-19 — Save access key ID for subsequent tests"
      ansible.builtin.set_fact:
        created_access_key_id: "{{ tc19_apply.access_key.AccessKeyId }}"

    # ==================================================================
    # TC-20: Deactivate access key (Active→Inactive) (4-phase)
    # ==================================================================
    - name: "TC-20 Phase 1 — Deactivate access key (check mode)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_id: "{{ created_access_key_id }}"
        access_key_status: "Inactive"
      check_mode: true
      register: tc20_check

    - name: "TC-20 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc20_check.changed == true
        fail_msg: "TC-20 Phase 1 FAILED: check mode should report changed for status update"
        success_msg: "TC-20 Phase 1 PASSED"

    - name: "TC-20 Phase 2 — Deactivate access key (apply)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_id: "{{ created_access_key_id }}"
        access_key_status: "Inactive"
      register: tc20_apply

    - name: "TC-20 Phase 2 — Assert key deactivated"
      ansible.builtin.assert:
        that:
          - tc20_apply.changed == true
        fail_msg: "TC-20 Phase 2 FAILED: key status update should report changed"
        success_msg: "TC-20 Phase 2 PASSED"

    - name: "TC-20 Phase 3 — Re-run deactivate (check mode, no changes expected)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_id: "{{ created_access_key_id }}"
        access_key_status: "Inactive"
      check_mode: true
      register: tc20_check_idem

    - name: "TC-20 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc20_check_idem.changed == false
        fail_msg: "TC-20 Phase 3 FAILED: same status should be idempotent in check mode"
        success_msg: "TC-20 Phase 3 PASSED"

    - name: "TC-20 Phase 4 — Re-run deactivate (idempotence)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_id: "{{ created_access_key_id }}"
        access_key_status: "Inactive"
      register: tc20_idem

    - name: "TC-20 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc20_idem.changed == false
        fail_msg: "TC-20 Phase 4 FAILED: same status should be idempotent"
        success_msg: "TC-20 Phase 4 PASSED"

    # ==================================================================
    # TC-21: Idempotent key status (re-assert Inactive→Inactive)
    # ==================================================================
    - name: "TC-21 — Set Inactive again (explicit idempotent test)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_id: "{{ created_access_key_id }}"
        access_key_status: "Inactive"
      register: tc21_result

    - name: "TC-21 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc21_result.changed == false
        fail_msg: "TC-21 FAILED: setting same status again should be idempotent"
        success_msg: "TC-21 PASSED"

    # ==================================================================
    # TC-22: Delete access key (4-phase)
    # ==================================================================
    - name: "TC-22 Phase 1 — Delete access key (check mode)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_state: absent
        access_key_id: "{{ created_access_key_id }}"
      check_mode: true
      register: tc22_check

    - name: "TC-22 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc22_check.changed == true
        fail_msg: "TC-22 Phase 1 FAILED: check mode should report changed for key deletion"
        success_msg: "TC-22 Phase 1 PASSED"

    - name: "TC-22 Phase 2 — Delete access key (apply)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_state: absent
        access_key_id: "{{ created_access_key_id }}"
      register: tc22_apply

    - name: "TC-22 Phase 2 — Assert key deleted"
      ansible.builtin.assert:
        that:
          - tc22_apply.changed == true
        fail_msg: "TC-22 Phase 2 FAILED: key deletion should report changed"
        success_msg: "TC-22 Phase 2 PASSED"

    - name: "TC-22 Phase 3 — Verify key is gone via info"
      dellemc.objectscale.iam_user_info:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_access_keys: true
      register: tc22_info

    - name: "TC-22 Phase 3 — Assert access key no longer listed"
      ansible.builtin.assert:
        that:
          - >-
            created_access_key_id not in
            (tc22_info.iam_users[0].access_keys | map(attribute='AccessKeyId') | list)
        fail_msg: "TC-22 Phase 3 FAILED: deleted key should not appear in access keys list"
        success_msg: "TC-22 Phase 3 verified — key is gone"

    # ==================================================================
    # TC-23: Verify with iam_user_info include_access_keys
    #        Create a fresh key, then verify it appears in info
    # ==================================================================
    - name: "TC-23 — Create a fresh access key for info verification"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        access_key_state: present
      register: tc23_create

    - name: "TC-23 — Assert new key created"
      ansible.builtin.assert:
        that:
          - tc23_create.changed == true
          - tc23_create.access_key.AccessKeyId is defined
        fail_msg: "TC-23 setup FAILED: could not create access key"
        success_msg: "TC-23 setup — new access key created"

    - name: "TC-23 — Save new key ID"
      ansible.builtin.set_fact:
        tc23_key_id: "{{ tc23_create.access_key.AccessKeyId }}"

    - name: "TC-23 — Retrieve user info with access keys"
      dellemc.objectscale.iam_user_info:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_access_keys: true
      register: tc23_info

    - name: "TC-23 — Assert access key visible in info"
      ansible.builtin.assert:
        that:
          - tc23_info.iam_users | length == 1
          - tc23_info.iam_users[0].access_keys | length >= 1
          - >-
            tc23_key_id in
            (tc23_info.iam_users[0].access_keys | map(attribute='AccessKeyId') | list)
        fail_msg: "TC-23 FAILED: access key should be visible via iam_user_info include_access_keys"
        success_msg: "TC-23 PASSED — access key verified via info module"

    - name: "TC-23 — Assert key status is Active"
      ansible.builtin.assert:
        that:
          - >-
            (tc23_info.iam_users[0].access_keys |
             selectattr('AccessKeyId', 'equalto', tc23_key_id) |
             map(attribute='Status') | first) == 'Active'
        fail_msg: "TC-23 FAILED: new key should have Active status"
        success_msg: "TC-23 — key status is Active"

  always:
    - name: "Cleanup — Force-delete test user (removes all access keys)"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"
