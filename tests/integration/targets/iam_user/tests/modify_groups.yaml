---
# ============================================================================
# modify_groups.yaml — Group membership tests
# TC-17: Add user to group (4-phase)
# TC-18: Verify with iam_user_info include_groups
#
# NOTE: No iam_group module exists yet, so we create/delete the test group
#       via the ObjectScale IAM REST API using the uri module.
# ============================================================================

- module_defaults:
    dellemc.objectscale.iam_user:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
    dellemc.objectscale.iam_user_info:
      objectscale_host: "{{ objectscale_host }}"
      objectscale_username: "{{ objectscale_username }}"
      objectscale_password: "{{ objectscale_password }}"
      objectscale_port: "{{ objectscale_port }}"
      validate_certs: "{{ validate_certs }}"
  block:
    # ==================================================================
    # Setup: Obtain auth token and create test group via raw API
    # ==================================================================
    - name: "Group tests — Obtain ObjectScale auth token"
      ansible.builtin.uri:
        url: "https://{{ objectscale_host }}:{{ objectscale_port }}/login"
        method: GET
        url_username: "{{ objectscale_username }}"
        url_password: "{{ objectscale_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs }}"
        return_content: true
        status_code: [200]
      register: login_result

    - name: "Group tests — Extract auth token"
      ansible.builtin.set_fact:
        iam_auth_token: "{{ login_result.x_sds_auth_token }}"

    - name: "Group tests — Delete test group if exists (cleanup)"
      ansible.builtin.uri:
        url: "https://{{ objectscale_host }}:{{ objectscale_port }}/iam?Action=DeleteGroup&GroupName={{ test_group_name }}"
        method: POST
        headers:
          X-SDS-AUTH-TOKEN: "{{ iam_auth_token }}"
          x-emc-namespace: "{{ objectscale_namespace }}"
          Accept: application/json
        validate_certs: "{{ validate_certs }}"
        status_code: [200, 404, 409]
      failed_when: false

    - name: "Group tests — Create test group via IAM API"
      ansible.builtin.uri:
        url: "https://{{ objectscale_host }}:{{ objectscale_port }}/iam?Action=CreateGroup&GroupName={{ test_group_name }}"
        method: POST
        headers:
          X-SDS-AUTH-TOKEN: "{{ iam_auth_token }}"
          x-emc-namespace: "{{ objectscale_namespace }}"
          Accept: application/json
        validate_certs: "{{ validate_certs }}"
        status_code: [200]
      register: create_group_result

    - name: "Group tests — Assert test group created"
      ansible.builtin.assert:
        that:
          - create_group_result.status == 200
        fail_msg: "Group tests setup FAILED: could not create test group"
        success_msg: "Group tests setup — test group created"

    # ==================================================================
    # Setup: create user for group membership tests
    # ==================================================================
    - name: "Group tests — Pre-cleanup user"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"

    - name: "Group tests — Create user"
      ansible.builtin.include_tasks: _helper_create_user.yaml
      vars:
        helper_user_name: "{{ user_name }}"

    # ==================================================================
    # TC-17: Add user to group (4-phase)
    # ==================================================================
    - name: "TC-17 Phase 1 — Add user to group (check mode)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        groups:
          - "{{ test_group_name }}"
      check_mode: true
      register: tc17_check

    - name: "TC-17 Phase 1 — Assert check mode reports changed"
      ansible.builtin.assert:
        that:
          - tc17_check.changed == true
        fail_msg: "TC-17 Phase 1 FAILED: check mode should report changed for new group membership"
        success_msg: "TC-17 Phase 1 PASSED"

    - name: "TC-17 Phase 2 — Add user to group (apply)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        groups:
          - "{{ test_group_name }}"
      register: tc17_apply

    - name: "TC-17 Phase 2 — Assert group membership added"
      ansible.builtin.assert:
        that:
          - tc17_apply.changed == true
        fail_msg: "TC-17 Phase 2 FAILED: group membership should report changed"
        success_msg: "TC-17 Phase 2 PASSED"

    - name: "TC-17 Phase 3 — Re-run same group (check mode, no changes expected)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        groups:
          - "{{ test_group_name }}"
      check_mode: true
      register: tc17_check_idem

    - name: "TC-17 Phase 3 — Assert check mode reports no change"
      ansible.builtin.assert:
        that:
          - tc17_check_idem.changed == false
        fail_msg: "TC-17 Phase 3 FAILED: same group should be idempotent in check mode"
        success_msg: "TC-17 Phase 3 PASSED"

    - name: "TC-17 Phase 4 — Re-run same group (idempotence)"
      dellemc.objectscale.iam_user:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        state: present
        groups:
          - "{{ test_group_name }}"
      register: tc17_idem

    - name: "TC-17 Phase 4 — Assert idempotent (changed=false)"
      ansible.builtin.assert:
        that:
          - tc17_idem.changed == false
        fail_msg: "TC-17 Phase 4 FAILED: same group should be idempotent"
        success_msg: "TC-17 Phase 4 PASSED"

    # ==================================================================
    # TC-18: Verify with iam_user_info include_groups
    # ==================================================================
    - name: "TC-18 — Get user info with groups"
      dellemc.objectscale.iam_user_info:
        user_name: "{{ user_name }}"
        namespace_name: "{{ objectscale_namespace }}"
        include_groups: true
      register: tc18_info

    - name: "TC-18 — Assert user belongs to test group"
      ansible.builtin.assert:
        that:
          - tc18_info.iam_users | length == 1
          - tc18_info.iam_users[0].groups | length >= 1
          - >-
            test_group_name in
            (tc18_info.iam_users[0].groups | map(attribute='GroupName') | list)
        fail_msg: "TC-18 FAILED: user should belong to test group"
        success_msg: "TC-18 PASSED — group membership verified via info"

  always:
    # ==================================================================
    # Cleanup: remove user, then delete test group
    # ==================================================================
    - name: "Cleanup — Remove test user"
      ansible.builtin.include_tasks: _helper_cleanup.yaml
      vars:
        cleanup_user_name: "{{ user_name }}"

    - name: "Cleanup — Re-obtain auth token (in case it expired)"
      ansible.builtin.uri:
        url: "https://{{ objectscale_host }}:{{ objectscale_port }}/login"
        method: GET
        url_username: "{{ objectscale_username }}"
        url_password: "{{ objectscale_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_certs }}"
        return_content: true
        status_code: [200]
      register: cleanup_login
      failed_when: false

    - name: "Cleanup — Delete test group via IAM API"
      ansible.builtin.uri:
        url: "https://{{ objectscale_host }}:{{ objectscale_port }}/iam?Action=DeleteGroup&GroupName={{ test_group_name }}"
        method: POST
        headers:
          X-SDS-AUTH-TOKEN: "{{ cleanup_login.x_sds_auth_token | default(iam_auth_token | default('')) }}"
          x-emc-namespace: "{{ objectscale_namespace }}"
          Accept: application/json
        validate_certs: "{{ validate_certs }}"
        status_code: [200, 404, 409]
      failed_when: false
