---
- name: Storage Pool Functional Tests
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    objectscale_host: "{{ lookup('env', 'OBJECTSCALE_HOST') | default('10.247.101.251', true) }}"
    objectscale_username: "{{ lookup('env', 'OBJECTSCALE_USERNAME') | default('admin1', true) }}"
    objectscale_password: "{{ lookup('env', 'OBJECTSCALE_PASSWORD') | default('ChangeMe', true) }}"
    test_pool_name: "sp_ft_test_{{ now(utc=true, fmt='%Y%m%d%H%M%S') }}"

  tasks:
    - name: FT-001 Create storage pool
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        description: "Functional test pool"
        is_cold_storage_enabled: false
        warning_alert_at: 70
        error_alert_at: 85
        state: present
      register: create_result
      ignore_errors: true

    - name: Debug FT-001 result
      debug:
        var: create_result
      when: create_result.failed

    - name: Verify FT-001 create result
      assert:
        that:
          - create_result.changed is true
          - create_result.storage_pool_details is defined
          - create_result.storage_pool_details.name == test_pool_name
        fail_msg: "FT-001 Create pool failed"

    - name: FT-002 Idempotent create (no change expected)
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        description: "Functional test pool"
        is_cold_storage_enabled: false
        warning_alert_at: 70
        error_alert_at: 85
        state: present
      register: idempotent_result

    - name: Verify FT-002 idempotent result
      assert:
        that:
          - idempotent_result.changed is false
        fail_msg: "FT-002 Idempotent create should not change"

    - name: FT-003 Modify pool description
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        description: "Updated description from FT"
        state: present
      register: modify_result

    - name: Verify FT-003 modify result
      assert:
        that:
          - modify_result.changed is true
          - modify_result.storage_pool_details.description == "Updated description from FT"
        fail_msg: "FT-003 Modify pool failed"

    - name: FT-004 Modify warning alert threshold
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        warning_alert_at: 60
        state: present
      register: alert_result

    - name: Verify FT-004 alert threshold change
      assert:
        that:
          - alert_result.changed is true
        fail_msg: "FT-004 Modify alert threshold failed"

    - name: FT-005 Check mode preview (no actual change)
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        description: "Check mode test"
        state: present
      check_mode: true
      register: check_result

    - name: Verify FT-005 check mode result
      assert:
        that:
          - check_result.changed is true
          - check_result.storage_pool_details is defined
        fail_msg: "FT-005 Check mode failed"

    - name: FT-006 Verify check mode did not apply changes
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        state: present
      register: verify_result

    - name: Verify FT-006 check mode did not apply
      assert:
        that:
          - verify_result.storage_pool_details.description != "Check mode test"
        fail_msg: "FT-006 Check mode should not have applied changes"

    - name: FT-007 Delete storage pool
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        state: absent
      register: delete_result

    - name: Verify FT-007 delete result
      assert:
        that:
          - delete_result.changed is true
        fail_msg: "FT-007 Delete pool failed"

    - name: FT-008 Idempotent delete (already absent)
      dellemc.objectscale.storage_pool:
        objectscale_host: "{{ objectscale_host }}"
        objectscale_username: "{{ objectscale_username }}"
        objectscale_password: "{{ objectscale_password }}"
        validate_certs: false
        storage_pool_name: "{{ test_pool_name }}"
        state: absent
      register: delete_idempotent

    - name: Verify FT-008 idempotent delete
      assert:
        that:
          - delete_idempotent.changed is false
        fail_msg: "FT-008 Idempotent delete should not change"

    - name: Summary
      debug:
        msg: |
          ✅ All 8 functional tests passed:
          - FT-001: Create storage pool
          - FT-002: Idempotent create
          - FT-003: Modify description
          - FT-004: Modify alert threshold
          - FT-005: Check mode preview
          - FT-006: Verify check mode isolation
          - FT-007: Delete pool
          - FT-008: Idempotent delete
